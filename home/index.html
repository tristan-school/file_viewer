<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Launcher</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- App Launcher Header -->
  <header class="app-header">
    <div class="logo">
      <i class="fa-solid fa-shapes"></i> AppHub Launcher
    </div>
  </header>

  <!-- Central Tool Launcher Grid -->
  <main class="launcher-container">
    <div class="launcher-grid">

      <!-- Launch PPTX Viewer Button / Tile -->
      <a href="/pptx-viewer" class="tool-card primary">
        <div class="icon-wrapper">
          <i class="fa-solid fa-file-powerpoint"></i>
        </div>
        <div class="tool-info">
          <h2>PPTX Viewer</h2>
          <p>Launch Presentation Tool</p>
        </div>
        <span class="launch-btn">Launch <i class="fa-solid fa-arrow-right"></i></span>
      </a>

      <!-- Launch PDF Viewer -->
      <a href="/pdf-viewer.html" class="tool-card">
        <div class="icon-wrapper">
          <i class="fa-solid fa-file-pdf"></i>
        </div>
        <div class="tool-info">
          <h2>PDF Reader</h2>
          <p>Launch Document Viewer</p>
        </div>
        <span class="launch-btn">Launch <i class="fa-solid fa-arrow-right"></i></span>
      </a>

      <!-- Launch Media Player -->
      <a href="/media-player.html" class="tool-card">
        <div class="icon-wrapper">
          <i class="fa-solid fa-circle-play"></i>
        </div>
        <div class="tool-info">
          <h2>Media Player</h2>
          <p>Launch Audio & Video Player</p>
        </div>
        <span class="launch-btn">Launch <i class="fa-solid fa-arrow-right"></i></span>
      </a>

      <!-- Launch Canvas -->
      <a href="/canvas.html" class="tool-card">
        <div class="icon-wrapper">
          <i class="fa-solid fa-palette"></i>
        </div>
        <div class="tool-info">
          <h2>Whiteboard Canvas</h2>
          <p>Launch Drawing Studio</p>
        </div>
        <span class="launch-btn">Launch <i class="fa-solid fa-arrow-right"></i></span>
      </a>

    </div>
  </main>

</body>
</html>
